name: AudioWhisper Keyboard CI

# Runs the same checks as a local `./gradlew test :app:lintDebug :lib:rust:check
# :app:checkNativeDeclarations :app:checkJvmLedger assembleDebug :app:compileDebugAndroidTestKotlin`: every JVM test
# (including those that go through the Rust JNI under LatinIME's class names), Android lint, every
# Rust crate's tests (the LatinIME port's against golden files of the C++'s answers), clippy with
# warnings as errors (on the host and for Android, with and without the off-by-default GPU
# renderer), rustfmt and rustdoc with warnings as errors, that every Kotlin native declaration and JNI export in the debug APK
# match, that every hand-written JVM file is within its budget in docs/jvm-ledger.tsv, then a
# debug build, and that the on-device tests still compile.
# Before that, `cargo audit` checks the locked Rust crates against RustSec's advisories.
#
# It needs nothing from a developer's machine: jetpref comes from third_party/m2, the sherpa-onnx
# AAR from Git LFS, Rust from rust-toolchain.toml and the NDK from tools.versions.toml. GIPHY has
# no key here, which only leaves the GIF search without results.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - "LICENSE"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Apple silicon, like the development Mac, where the golden files of the C++'s typing answers
    # were written: on arm64 the C++ fused the multiply-adds the Rust writes as `mul_add`
    # (lib/rust/crates/latin/src/search/mod.rs). Linux arm64 runners can't build Android: the
    # SDK's build tools and the NDK are x86-64 only on Linux.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - uses: gradle/actions/wrapper-validation@v4

      # JDK 24, as on the development Mac: JavaTextTest compares the Rust character tables
      # with this JVM's java.lang, and they follow JDK 24's Unicode 16. JDK 21 (Unicode 15)
      # answers differently for the characters added since.
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: 24
          distribution: temurin

      - name: Install the pinned NDK
        # The Rust task links with the NDK's clang before anything else would download it.
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"$/\1/p' gradle/tools.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null

      - name: Install the pinned Rust toolchain
        # rustup reads lib/rust/rust-toolchain.toml: the release, clippy, rustfmt and the
        # Android target.
        working-directory: lib/rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - name: Check the Rust dependencies against RustSec advisories
        # The lockfile, against RustSec's database as fetched now: a newly published advisory
        # for any locked crate fails the build until that crate is updated.
        working-directory: lib/rust
        run: cargo audit

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lib/rust -> build/cargo

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build
        run: ./gradlew --stacktrace test :app:lintDebug :lib:rust:check :app:checkNativeDeclarations :app:checkJvmLedger assembleDebug :app:compileDebugAndroidTestKotlin

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
