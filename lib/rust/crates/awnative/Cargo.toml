[package]
name = "awnative"
version = "0.1.0"
description = "The keyboard's native library: JNI entry points for the crates beside it"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Only device replay APKs expose the test buffer snapshot; production Android has no legacy JNI.
legacy-fixture = []
latin-fixture = ["legacy-fixture"]
dictation-fixture = ["legacy-fixture"]
tts-fixture = ["sherpa-ffi/tts-fixture", "legacy-fixture"]
# The experimental GPU renderer behind the `aw-hybrid` log switch (render's `hybrid`). Off, the
# switch is ignored and the CPU renderer draws; no build that ships turns it on.
hybrid = ["render/hybrid", "dep:wgpu", "dep:raw-window-handle"]

[build-dependencies]
# Generates the JNI entry points declared in crates/boundary (build.rs).
boundary = { path = "../boundary" }

[dependencies]
settings = { path = "../settings" }
backup = { path = "../backup" }
utilities = { path = "../utilities" }
sherpa-ffi = { path = "../sherpa-ffi" }
chars = { path = "../chars" }
composing = { path = "../composing" }
dictation = { path = "../dictation" }
emoji = { path = "../emoji" }
editor = { path = "../editor" }
extensions = { path = "../extensions" }
gestures = { path = "../gestures" }
gif = { path = "../gif" }
glide = { path = "../glide" }
input = { path = "../input" }
keygraph = { path = "../keygraph" }
imesubtype = { path = "../imesubtype" }
imetheme = { path = "../imetheme" }
keys = { path = "../keys" }
latin = { path = "../latin" }
ngram = { path = "../ngram" }
nlp = { path = "../nlp" }
popup = { path = "../popup" }
reader = { path = "../reader" }
render = { path = "../render" }
shift = { path = "../shift" }
spacing = { path = "../spacing" }
snygg = { path = "../snygg" }
stores = { path = "../stores" }
suggest = { path = "../suggest" }
wire = { path = "../wire" }
# The Mac app's transcript rules (filler words, custom vocabulary), from AudioWhisper-Core, the
# Rust both apps share. Pinned to a commit; bump the rev to take a newer core.
transcript = { git = "https://github.com/jtn0123/AudioWhisper-Core", rev = "eb7c4057ee016fca71e50c051f51339caf5b5295" }
# jni.h as Rust declarations, nothing more. 0.3.0 has no dependencies of its own.
jni-sys = "=0.3.0"
serde_json = "=1.0.154"
raw-window-handle = { version = "=0.6.2", optional = true }
wgpu = { version = "=29.0.3", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }

[lints]
workspace = true
