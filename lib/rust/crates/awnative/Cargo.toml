[package]
name = "awnative"
version = "0.1.0"
description = "The keyboard's native library: JNI entry points for the crates beside it"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
chars = { path = "../chars" }
dictation = { path = "../dictation" }
gestures = { path = "../gestures" }
gif = { path = "../gif" }
glide = { path = "../glide" }
keys = { path = "../keys" }
popup = { path = "../popup" }
reader = { path = "../reader" }
shift = { path = "../shift" }
spacing = { path = "../spacing" }
suggest = { path = "../suggest" }
# jni.h as Rust declarations, nothing more. 0.3.0 has no dependencies of its own.
jni-sys = "=0.3.0"

[lints]
workspace = true
