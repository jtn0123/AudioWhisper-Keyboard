[package]
name = "render"
version = "0.1.0"
description = "Stage 3 keyboard scene with pure Rust CPU and Vulkan renderers"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
wire = { path = "../wire" }
backup = { path = "../backup" }
settings = { path = "../settings" }
input = { path = "../input" }
keys = { path = "../keys" }
gestures = { path = "../gestures" }
popup = { path = "../popup" }
snygg = { path = "../snygg" }
# Kotlin's string rules and the user dictionary's checks, for the user dictionary screens.
chars = { path = "../chars" }
# The extension editor's checks, for the theme editor's component meta.
extensions = { path = "../extensions" }
utilities = { path = "../utilities" }
parley = { version = "=0.13.0", default-features = false, features = ["std"] }
read-fonts = "=0.47.0"
# Android-style hinted UI text: unscaled advances and UAX #14 break opportunities.
skrifa = { version = "=0.49.0", default-features = false, features = ["std"] }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
vello_cpu = "=0.4.0"
# The experimental GPU renderer (`hybrid`), only with the feature of that name.
vello_hybrid = { version = "=0.2.0", default-features = false, features = ["wgpu", "text"], optional = true }
wgpu = { version = "=29.0.3", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }
# Hybrid's text feature does not enable decoding embedded PNG glyphs by itself.
glifo_hybrid = { package = "glifo", version = "=0.3.0", default-features = false, features = ["std", "png"], optional = true }
pollster = { version = "=1.0.1", optional = true }
vello_common_hybrid = { package = "vello_common", version = "=0.2.0", optional = true }

unicode-segmentation = "=1.12.0"
# AboutLibraries' generated JSON; preserve_order keeps the `licenses` keys in file order.
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

[features]
# Vello Hybrid over wgpu/Vulkan, an experiment the CPU renderer replaced. Off in every shipped
# build: it brings wgpu and its graphics stack into the library (docs/decisions.md). Gradle's
# `cargoAndroidHybridClippy` keeps it compiling; a test fails if anything turns it on by default.
hybrid = ["dep:vello_hybrid", "dep:wgpu", "dep:glifo_hybrid", "dep:pollster", "dep:vello_common_hybrid"]

[lints]
workspace = true

[[example]]
name = "settings_color_probe"
path = "../../../../benchmark/settings-color-probe.rs"

[[example]]
name = "settings_font_probe"
path = "../../../../benchmark/settings-font-probe.rs"

[[example]]
name = "settings_licences_timing"
path = "../../../../benchmark/settings-licences-timing.rs"

[[example]]
name = "keyboard_frame_timing"
path = "../../../../benchmark/keyboard-frame-timing.rs"

[[example]]
name = "smartbar_roomy_pictures"
path = "../../../../benchmark/smartbar-roomy-pictures.rs"
