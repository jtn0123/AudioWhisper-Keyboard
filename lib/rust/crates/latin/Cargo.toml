[package]
name = "latin"
version = "0.1.0"
description = "The typing decoder: LatinIME's dictionary reading and suggestion search, ported from its C++"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Opt in only for the differential test suite; ordinary tests never build the C++.
oracle = ["dep:latin-oracle"]

# Optional dependencies (unlike dev-dependencies) can be controlled by a Cargo feature.
[target.'cfg(not(target_os = "android"))'.dependencies]
latin-oracle = { path = "../latin-oracle", optional = true }

[lints]
workspace = true
