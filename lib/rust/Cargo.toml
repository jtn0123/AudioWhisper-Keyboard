# AudioWhisper Keyboard's native code in Rust, built into one library, libawnative.so.
# Gradle runs cargo (see build.gradle.kts); docs/rust.md explains the layout and the rules.
[workspace]
members = ["crates/*"]
# Everyday commands stay Rust-only; oracleCheck explicitly selects the full workspace.
default-members = [
    "crates/awnative",
    "crates/backup",
    "crates/settings",
    "crates/utilities",
    "crates/chars",
    "crates/composing",
    "crates/dictation",
    "crates/emoji",
    "crates/extensions",
    "crates/editor",
    "crates/gestures",
    "crates/gif",
    "crates/glide",
    "crates/keys",
    "crates/input",
    "crates/latin",
    "crates/lexicon",
    "crates/ngram",
    "crates/nlp",
    "crates/popup",
    "crates/reader",
    "crates/render",
    "crates/scoreboard",
    "crates/shift",
    "crates/sherpa-ffi",
    "crates/spacing",
    "crates/snygg",
    "crates/suggest",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.98"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
codegen-units = 1
lto = true
# A panic aborts the process rather than unwinding into the JVM; the panic hook logs it first.
panic = "abort"
strip = true

# The opt-in differential tests put hundreds of thousands of questions to Rust and LatinIME's C++;
# unoptimised, the C++ alone took over a minute. Overflow checks and debug assertions stay on.
[profile.dev.package.latin]
opt-level = 2

[profile.dev.package.latin-oracle]
opt-level = 2
